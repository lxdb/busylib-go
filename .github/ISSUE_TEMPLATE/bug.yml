name: Bug report
description: Report a reproducible defect.
title: "bug: "
body:
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: Describe the exact result and error type.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest safe reproduction.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Include module, Go, and firmware versions.
    validations:
      required: true
  - type: dropdown
    id: transport
    attributes:
      label: Transport
      options: [Local HTTP, Local WebSocket, Remote MQTT, USB CLI, Media conversion]
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety
      options:
        - label: I removed credentials, device tokens, and personal data.
          required: true
