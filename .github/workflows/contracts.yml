name: Contracts

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: busy-app/busybar-firmware
          ref: release
          path: busybar-firmware
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
          cache-dependency-path: go.sum
      - run: scripts/verify.sh firmware

  generated:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: protobuf-source
        shell: bash
        run: |
          source scripts/protobuf-source.env
          echo "repository=$PROTOBUF_SOURCE_REPOSITORY" >> "$GITHUB_OUTPUT"
          echo "revision=$PROTOBUF_SOURCE_REVISION" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ steps.protobuf-source.outputs.repository }}
          ref: ${{ steps.protobuf-source.outputs.revision }}
          path: busybar-protobuf
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
          cache-dependency-path: go.sum
      - name: Install protoc
        shell: bash
        run: |
          source scripts/protobuf-tools.env
          version="${PROTOC_VERSION#libprotoc }"
          archive="protoc-${version}-linux-x86_64.zip"
          curl --fail --location --silent --show-error \
            --output "${RUNNER_TEMP}/${archive}" \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${version}/${archive}"
          echo "${PROTOC_LINUX_X86_64_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check -
          unzip -q "${RUNNER_TEMP}/${archive}" -d "${RUNNER_TEMP}/protoc"
          echo "${RUNNER_TEMP}/protoc/bin" >> "${GITHUB_PATH}"
      - run: scripts/verify.sh generated
        env:
          BUSYLIB_GO_PROTO_SRC: ${{ github.workspace }}/busybar-protobuf
